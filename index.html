<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Proposition en attente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>

  <main class="porte-page" id="porte">
    <div class="prive prive--porte prive--attente">
      <div class="attente-icone" aria-hidden="true">
        <svg class="attente-cadenas" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.6v2.2"/></svg>
        <span class="attente-horloge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      </div>
      <p class="attente-etat"><span class="attente-point"></span>En attente</p>
      <h1 class="prive-titre">Proposition en attente</h1>
      <p class="prive-periode">Cokette Girls · Septembre 2026</p>
      <p class="prive-sous">Cette proposition est suspendue pour le moment. Elle n'est plus consultable.</p>

      <form class="attente-forme" id="porte-forme" novalidate hidden>
        <div class="prive-saisie">
          <label class="visually-hidden" for="porte-mdp">Phrase de passe</label>
          <input class="prive-champ" type="password" id="porte-mdp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Phrase de passe" enterkeyhint="go">
          <button class="btn btn--primary" type="submit" id="porte-ouvrir">Ouvrir</button>
        </div>
        <p class="prive-etat" id="porte-etat" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <div id="contenu" hidden></div>

  <div class="verrou" id="verrou" hidden role="alertdialog" aria-labelledby="verrou-titre">
    <div class="verrou-boite">
      <p class="verrou-titre" id="verrou-titre">Session fermée</p>
      <p class="verrou-texte">Le document s'est refermé après cinq minutes sans activité.</p>
      <button class="btn btn--primary" type="button" id="verrou-rouvrir">Saisir à nouveau la phrase</button>
    </div>
  </div>

  <script src="./attente.js"></script>
  <script src="./app.js"></script>
  <script type="module" src="./coffre.js"></script>
</body>
</html>
